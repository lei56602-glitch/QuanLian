pluginManagement {
    repositories {
        // Use mirrors first to avoid transient/unreachable upstream Maven endpoints in CI.
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
        maven { url = uri("https://maven.aliyun.com/repository/central") }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // AndroidX / Android Gradle Plugin artifacts.
        maven { url = uri("https://maven.aliyun.com/repository/google") }
        // Maven Central artifacts and transitive dependencies.
        maven { url = uri("https://maven.aliyun.com/repository/central") }
        google()
        mavenCentral()
    }
}

rootProject.name = 'QuanLian'
include ':app'
