name: Windows desktop build
on:
  push:
    branches: [ feature/windows-desktop ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [ feature/windows-desktop ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF application
        run: dotnet build windows/QuanLian.Windows/QuanLian.Windows.csproj --configuration Release
