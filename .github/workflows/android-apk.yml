name: Android APK
on:
  push:
    branches: [ main, v1.0-development, feature/hotspot-direct-transfer ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
      - name: Run Android lint and build debug APK
        run: gradle --no-daemon lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuanLian-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
      - name: Diagnose release signing secrets (values are never printed)
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              echo "$name: present"
            else
              echo "$name: MISSING"
            fi
          done
      - name: Prepare release signing key
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quanlian-release.jks"
      - name: Build signed release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_KEYSTORE_PASSWORD != '' && env.RELEASE_KEY_ALIAS != '' && env.RELEASE_KEY_PASSWORD != '' }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/quanlian-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: success() && env.RELEASE_KEYSTORE_BASE64 != ''
        with:
          name: QuanLian-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
# Trigger signed release build after repository signing secrets setup.
