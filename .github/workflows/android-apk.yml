name: Android APK
on:
  push:
    branches: [ main, v1.0-development ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
      - name: Run Android lint and build debug APK
        run: gradle --no-daemon lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QuanLian-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
